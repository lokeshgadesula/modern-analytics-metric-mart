[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="modern-analytics-metric-mart"
version="0.1.0"
requires-python=">=3.10"
[project.optional-dependencies]
dev=["pytest>=8"]
stack=["dagster>=1.7","dagster-webserver>=1.7","dagster-dbt>=0.23","dbt-snowflake>=1.8"]
[tool.setuptools.packages.find]
where=["src"]
